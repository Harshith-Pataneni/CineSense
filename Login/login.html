<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In - Movie & Series Decider</title>
  <link rel="stylesheet" href="login.css" />
</head>
<body>
  <div class="auth-wrapper">
    <!-- Brand Header -->
    <header class="auth-brand">
      <div class="brand-icon-wrapper">
        <span>🎬</span>
      </div>
      <h1>Decider</h1>
      <p>Your personal streaming concierge</p>
    </header>

    <div class="login-container">
      <!-- LOGIN PANEL -->
      <div id="loginPanel">
        <div class="panel-header">
          <h2>Welcome Back</h2>
          <p>Enter your credentials to access your watchlist</p>
        </div>

        <form id="loginForm">
          <div class="form-group">
            <label class="form-label" for="loginEmail">Email Address</label>
            <div class="input-wrapper">
              <span class="input-icon">✉️</span>
              <input type="email" id="loginEmail" placeholder="you@example.com" required autocomplete="email" />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="loginPassword">Password</label>
            <div class="input-wrapper">
              <span class="input-icon">🔒</span>
              <input type="password" id="loginPassword" placeholder="••••••••" required autocomplete="current-password" />
            </div>
          </div>

          <div id="loginError" class="error"></div>

          <button type="submit" class="btn-submit" id="loginSubmitBtn">
            <span>Sign In</span>
            <span>→</span>
          </button>
        </form>

        <div class="auth-divider">
          <span>or</span>
        </div>

        <button type="button" id="googleBtn" class="google-btn">
          <svg class="google-icon" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          <span>Continue with Google</span>
        </button>

        <p class="switch-link">
          Don't have an account? <a href="#" id="showSignup">Create one now</a>
        </p>

        <div class="guest-access-box">
          <button type="button" class="guest-btn" id="guestBtn">⚡ Continue as Guest</button>
        </div>
      </div>

      <!-- SIGNUP PANEL -->
      <div id="signupPanel" style="display:none;">
        <div class="panel-header">
          <h2>Create Account</h2>
          <p>Join Decider to get custom movie & TV picks</p>
        </div>

        <form id="signupForm">
          <div class="form-group">
            <label class="form-label" for="signupName">Full Name</label>
            <div class="input-wrapper">
              <span class="input-icon">👤</span>
              <input type="text" id="signupName" placeholder="Your name" required autocomplete="name" />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="signupEmail">Email Address</label>
            <div class="input-wrapper">
              <span class="input-icon">✉️</span>
              <input type="email" id="signupEmail" placeholder="you@example.com" required autocomplete="email" />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="signupPassword">Password</label>
            <div class="input-wrapper">
              <span class="input-icon">🔒</span>
              <input type="password" id="signupPassword" placeholder="At least 6 characters" required autocomplete="new-password" />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="signupConfirm">Confirm Password</label>
            <div class="input-wrapper">
              <span class="input-icon">🔒</span>
              <input type="password" id="signupConfirm" placeholder="Re-enter password" required autocomplete="new-password" />
            </div>
          </div>

          <div id="signupError" class="error"></div>
          <div id="signupSuccess" class="success"></div>

          <button type="submit" class="btn-submit" id="signupSubmitBtn">
            <span>Create Account</span>
            <span>→</span>
          </button>
        </form>

        <div class="auth-divider">
          <span>or</span>
        </div>

        <button type="button" id="googleBtnSignup" class="google-btn">
          <svg class="google-icon" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          <span>Sign up with Google</span>
        </button>

        <p class="switch-link">
          Already have an account? <a href="#" id="showLogin">Sign in instead</a>
        </p>
      </div>
    </div>
  </div>

  <script>
    // --- Toggle panels ---
    const showSignup = document.getElementById('showSignup');
    const showLogin = document.getElementById('showLogin');
    const loginPanel = document.getElementById('loginPanel');
    const signupPanel = document.getElementById('signupPanel');

    showSignup.addEventListener('click', (e) => {
      e.preventDefault();
      loginPanel.style.display = 'none';
      signupPanel.style.display = 'block';
    });

    showLogin.addEventListener('click', (e) => {
      e.preventDefault();
      signupPanel.style.display = 'none';
      loginPanel.style.display = 'block';
    });

    // --- Guest access helper ---
    const guestBtn = document.getElementById('guestBtn');
    if (guestBtn) {
      guestBtn.addEventListener('click', () => {
        localStorage.setItem('token', 'guest-token-' + Date.now());
        localStorage.setItem('userName', 'Guest Explorer');
        localStorage.setItem('userEmail', 'guest@decider.local');
        window.location.href = '../Main/index.html';
      });
    }

    // --- Login ---
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const errorDiv = document.getElementById('loginError');
      const submitBtn = document.getElementById('loginSubmitBtn');
      errorDiv.textContent = '';
      
      const originalText = submitBtn.innerHTML;
      submitBtn.innerHTML = '<span>Signing in...</span>';
      submitBtn.disabled = true;

      try {
        const response = await fetch('http://localhost:5000/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        const data = await response.json();
        if (response.ok) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('userEmail', data.email);
          localStorage.setItem('userName', data.name || data.email.split('@')[0]);
          window.location.href = '../Main/index.html';
        } else {
          errorDiv.textContent = data.message || 'Login failed. Please check your credentials.';
        }
      } catch (err) {
        errorDiv.textContent = 'Server unavailable. Make sure backend is running on port 5000, or try Continue as Guest.';
      } finally {
        submitBtn.innerHTML = originalText;
        submitBtn.disabled = false;
      }
    });

    // --- Signup ---
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('signupName').value.trim();
      const email = document.getElementById('signupEmail').value.trim();
      const password = document.getElementById('signupPassword').value;
      const confirm = document.getElementById('signupConfirm').value;
      const errorDiv = document.getElementById('signupError');
      const successDiv = document.getElementById('signupSuccess');
      const submitBtn = document.getElementById('signupSubmitBtn');
      errorDiv.textContent = '';
      successDiv.textContent = '';

      if (password !== confirm) {
        errorDiv.textContent = 'Passwords do not match.';
        return;
      }
      if (password.length < 6) {
        errorDiv.textContent = 'Password must be at least 6 characters.';
        return;
      }

      const originalText = submitBtn.innerHTML;
      submitBtn.innerHTML = '<span>Creating account...</span>';
      submitBtn.disabled = true;

      try {
        const response = await fetch('http://localhost:5000/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password }),
        });
        const data = await response.json();
        if (response.ok) {
          successDiv.textContent = 'Account created successfully! Redirecting to sign in...';
          setTimeout(() => {
            signupPanel.style.display = 'none';
            loginPanel.style.display = 'block';
            document.getElementById('loginEmail').value = email;
          }, 1400);
        } else {
          errorDiv.textContent = data.message || 'Registration failed.';
        }
      } catch (err) {
        errorDiv.textContent = 'Server unavailable. Make sure backend is running on port 5000.';
      } finally {
        submitBtn.innerHTML = originalText;
        submitBtn.disabled = false;
      }
    });

    // --- Google OAuth ---
    document.getElementById('googleBtn').addEventListener('click', () => {
      window.location.href = 'http://localhost:5000/auth/google';
    });
    document.getElementById('googleBtnSignup').addEventListener('click', () => {
      window.location.href = 'http://localhost:5000/auth/google';
    });
  </script>
</body>
</html>
